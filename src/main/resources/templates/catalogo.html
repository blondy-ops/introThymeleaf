<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catalogo de Juegos</title>
    <style>
        body { font-family: Arial, sans-serif;}
        table { width: 80%; margin: auto; border-collapse: collapse;}
        th, td { border:1px solid #ccc; padding: 10px; text-align: left;}
        th { background-color: #eee;}
        .agotado { color: red; font-weight: bold;}
        .disponible { color: green; font-weight: bold;}
    </style>
</head>
<body>
    <h1>Catalogo de videojuegos</h1>

    <table>
        <thead>
            <tr>
                <th>Titulo</th>
                <th>Genero</th>
                <th>Plataforma</th>
                <th>Precio</th>
                <th>Disponibilidad</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="juego : ${juegos}">
                <td th:text="${juego.titulo}">Juego Generico</td>
                <td th:text="${juego.genero}">Genero Generico</td>
                <td th:text="${juego.plataforma}">Consola</td>

                <td th:text="'$' + ${juego.precio}">0.00</td>

                <td>
                    <span th:if="${juego.disponible}" class="disponible">En Stock</span>

                    <span th:unless="${juego.disponible}" class="agotado">Agotado</span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(juegos)}">
                <td colspan="5" style="">No hay juegos disponibles en el catalogo en este momento.</td>
            </tr>
        </tbody>
    </table>

    <div style="">
        <a th:href="@{/}">Volver al inicio</a>
    </div>
</body>
</html>
